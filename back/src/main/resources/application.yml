server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  application:
    name: customer-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:customer_service}
    username: ${DB_USERNAME:customer_service}
    password: ${DB_PASSWORD:customer_service}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}
            required: ${SMTP_STARTTLS_REQUIRED:false}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  oauth2:
    issuer: ${APP_OAUTH2_ISSUER:http://localhost:4200}
    client-id: ${APP_OAUTH2_CLIENT_ID:presentation-client}
    redirect-uri: ${APP_OAUTH2_REDIRECT_URI:http://localhost:4200/callback}
  mail:
    enabled: ${APP_MAIL_ENABLED:false}
    from: ${APP_MAIL_FROM:no-reply@example.com}
    verification-base-url: ${APP_VERIFICATION_BASE_URL:http://localhost:4200/verify-email}
  admin:
    email: ${APP_ADMIN_EMAIL:admin@example.com}
    password: ${APP_ADMIN_PASSWORD:ChangeMe-Admin-Password-25!}
    name: ${APP_ADMIN_NAME:System Administrator}
    photo-url: ${APP_ADMIN_PHOTO_URL:https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?auto=format&fit=crop&w=256&q=80}

logging:
  level:
    root: INFO
    io.github.algerpire.customerservice: INFO

---
spring:
  config:
    import: optional:file:./application-local.yml
