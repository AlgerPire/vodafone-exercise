services:
  postgres:
    image: postgres:17-alpine
    container_name: customer-service-postgres
    environment:
      POSTGRES_DB: customer_service
      POSTGRES_USER: customer_service
      POSTGRES_PASSWORD: customer_service
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customer_service -d customer_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: customer-service-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
